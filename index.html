<body>
<div class="paper" aria-hidden="true"></div>
<header><a class="wordmark" href="#" aria-label="花ひらく — 最初に戻る"><svg viewBox="0 0 28 32" aria-hidden="true"><path d="M14 30V14M14 23C3 24 1 17 3 12c8-1 12 4 11 11m0-6C24 18 28 10 25 6c-9 0-12 5-11 11" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span>花ひらく<span class="brand-dot">.</span></span></a><div class="header-center">Akaneへ贈る一輪 · 10月20日</div></header>
<main id="journey" aria-label="一輪の花が育つまでの物語">
<section class="scene">
<div class="sky" id="sky" aria-hidden="true">
  <svg class="stars" id="stars" viewBox="0 0 1000 700" preserveAspectRatio="none"></svg>
  <div class="sun" id="sun"></div><div class="moon" id="moon"></div>
  <div class="clouds" id="clouds"><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><div class="cloud cloud-three"></div></div>
  <div class="horizon"></div>
</div>
<h1 class="sr-only">花ひらく — スクロールすると昼と夜がめぐり、小さな芽が育ちます。</h1>
<button id="begin" class="begin scene-instruction">スクロールして、時を進める <span class="arrow-circle">↓</span></button>
<div class="sky-status"><span class="sky-status-dot" aria-hidden="true"></span><span id="skyLabel">昼</span></div>
<section class="gift-message" id="giftMessage" aria-labelledby="giftHeading" aria-hidden="true">
  <span class="gift-date">10月20日 · あなただけに贈る一輪</span>
  <h2 id="giftHeading">Akaneへ</h2>
  <p>10月20日が、穏やかな一日になりますように。<br>いつも大切にされて、あなたらしく<br class="gift-break">花を咲かせていけますように。</p>
</section>
<div class="botanical" aria-hidden="true"><svg id="plant" viewBox="0 0 700 800" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="stemGradient" x1="0" x2="1"><stop stop-color="#203f2e"/><stop offset=".45" stop-color="#698052"/><stop offset=".7" stop-color="#9a9c61"/><stop offset="1" stop-color="#344d31"/></linearGradient>
<linearGradient id="leafGradient" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#244a38"/><stop offset=".5" stop-color="#627849"/><stop offset="1" stop-color="#a0a06a"/></linearGradient>
<radialGradient id="petalA" cx=".57" cy=".22" r=".91"><stop stop-color="#f3785a"/><stop offset=".35" stop-color="#df402e"/><stop offset=".73" stop-color="#bd1d20"/><stop offset="1" stop-color="#681522"/></radialGradient>
<radialGradient id="petalB" cx=".3" cy=".15" r=".9"><stop stop-color="#ff9976"/><stop offset=".35" stop-color="#eb5038"/><stop offset=".72" stop-color="#c52828"/><stop offset="1" stop-color="#701528"/></radialGradient>
<radialGradient id="heart"><stop stop-color="#626441"/><stop offset=".44" stop-color="#363a2a"/><stop offset=".66" stop-color="#252b24"/><stop offset="1" stop-color="#42151c"/></radialGradient>
<radialGradient id="ground"><stop stop-color="#435242" stop-opacity=".16"/><stop offset="1" stop-color="#435242" stop-opacity="0"/></radialGradient>
<filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<ellipse cx="355" cy="715" rx="130" ry="17" fill="url(#ground)"/>
<g id="roots" fill="none" stroke="#958e6a" stroke-width=".7" opacity=".4"><path d="M350 712q-5 18-35 27m35-27q10 18 32 24m-34-19q-4 20-17 29m21-30q3 17 13 25"/></g>
<path id="stem" fill="none" stroke="url(#stemGradient)" stroke-width="7" stroke-linecap="round"/>
<g id="leaves"></g>
<g id="flower">
  <g id="petals"></g>
  <g id="flowerCore">
    <g id="stamens"></g><circle r="22" fill="url(#heart)"/><g id="seedHead"></g>
  </g>
  <g id="bud">
    <g id="sepalLeft">
      <path d="M0 2C-12 0-18-10-17-23C-16-35-8-43 0-44C-2-28-2-12 0 2Z" fill="url(#leafGradient)"/>
      <path d="M-1 0Q-12-20-1-41" fill="none" stroke="#b1ab74" stroke-width=".7"/>
    </g>
    <g id="sepalRight">
      <path d="M0 2C12 0 18-10 17-23C16-35 8-43 0-44C2-28 2-12 0 2Z" fill="url(#leafGradient)"/>
      <path d="M1 0Q12-20 1-41" fill="none" stroke="#b1ab74" stroke-width=".7"/>
    </g>
  </g>
</g>
<g id="motes" fill="#9c9d72"></g>
</svg><span class="specimen-label"><span id="specimenNumber">図 01</span><i>ヒナゲシ</i><span>いのちの記録</span></span></div>
<div class="side-note">動くたび、少しずつ育つ</div>
<div class="time-readout"><span class="time-label">経過した時間</span><span class="day"><span id="day">01</span><small>日</small></span><span class="phase" id="phase">美しいものの、はじまり。</span></div>
<div class="chapter-caption" aria-live="polite"><span id="chapterIndex">01 / 04</span><span id="chapterPhrase">すべては、小さな芽から。</span></div>
<button class="replay" id="replay">もう一度、芽から <span>↺</span></button>
</section>
</main>
